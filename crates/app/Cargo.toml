[package]
name = "generator_3mf_app"
version = "0.2.0"
edition = "2021"

[lib]
name = "generator_3mf"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "generator_3mf"
path = "src/main.rs"

[package.metadata.android]
package = "com.frikks.generator_3mf"
apk_name = "generator_3mf"
label = "ГЕНЕРАТОР 3MF"
build_targets = ["aarch64-linux-android"]
icon = "@android:drawable/sym_def_app_icon"

[package.metadata.android.application]
has_code = false

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
label = "ГЕНЕРАТОР 3MF"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "generator_3mf"

[dependencies]
generator_3mf_core = { path = "../core" }
eframe = { version = "0.30", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
sys-locale = "0.3"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger = "0.11"
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Url",
    "Window",
] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }