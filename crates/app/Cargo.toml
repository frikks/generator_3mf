[package]
name = "generator_3mf"
description = "Gridfinity bin and baseplate generator with 3MF and STL export"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "generator_3mf"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generator_3mf"
path = "src/main.rs"

[dependencies]
generator_3mf_core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
log = "0.4"
sys-locale = "0.3"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
rfd = "0.17"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland", "clipboard", "links"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
sys-locale = { version = "0.3", features = ["js"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Navigator"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"

[package.metadata.android]
package = "io.github.frikks.generator3mf"
apk_name = "generator_3mf"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Gridfinity 3MF"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|density"
orientation = "unspecified"
