[package]
name = "generator_3mf_app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform GUI for ГЕНЕратор"

[dependencies]
generator_3mf_core = { path = "../core" }
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "persistence"] }
sys-locale = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "Url", "Window"] }