name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows binary
        run: |
          cargo build --release --example desktop || cargo build -p generator_3mf_app --release
          $VERSION = (Get-Content Cargo.toml | Select-String -Pattern '^version' | Select-Object -First 1).Line.Split('"')[1]
          New-Item -ItemType Directory -Force -Path out
          if (Test-Path target/release/generator_3mf.exe) {
            Copy-Item target/release/generator_3mf.exe "out/generator_3mf-$VERSION-windows-x86_64.exe"
          } elseif (Test-Path target/release/generator_3mf_app.exe) {
            Copy-Item target/release/generator_3mf_app.exe "out/generator_3mf-$VERSION-windows-x86_64.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 || cargo install wasm-bindgen-cli
      - name: Build Web via xtask
        run: cargo run -p xtask -- web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export CARGO_APK_RELEASE_KEYSTORE="$HOME/.android/debug.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          cargo apk build -p generator_3mf_app --release
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          cp target/release/apk/*.apk "out/generator_3mf-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  deploy-pages:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4