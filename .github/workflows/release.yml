name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  # Раскомментировать, если снова понадобится деплой на GitHub Pages:
  # pages: write
  # id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Run tests
        run: cargo test -p generator_3mf_core

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows binary
        run: |
          cargo build -p generator_3mf_app --bin generator_3mf --release
          $VERSION = (Get-Content Cargo.toml | Select-String -Pattern '^version' | Select-Object -First 1).Line.Split('"')[1]
          New-Item -ItemType Directory -Force -Path out
          Copy-Item target/release/generator_3mf.exe "out/generator_3mf-$VERSION-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  # web:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: wasm32-unknown-unknown
  #     - uses: Swatinem/rust-cache@v2
  #     - name: Install wasm-bindgen-cli
  #       run: cargo install wasm-bindgen-cli --force
  #     - name: Build Web via xtask
  #       run: cargo run -p xtask -- web
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: web
  #         path: dist/*
  #     - uses: actions/upload-pages-artifact@v3
  #       if: github.ref == 'refs/heads/main'
  #       with:
  #         path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked || cargo install cargo-apk --force
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export CARGO_APK_RELEASE_KEYSTORE="$HOME/.android/debug.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          cargo apk build -p generator_3mf_app --lib --release
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK_PATH=$(find target -name "*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/out/generator_3mf-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    needs: [windows, android] # Убран web; вернуть [windows, web, android] при раскомментировании web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          cp -r all-artifacts/windows/* release-assets/ || true
          cp -r all-artifacts/android/* release-assets/ || true
          # cp -r all-artifacts/web/* release-assets/ || true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

