name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p generator_3mf_core

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p generator_3mf_app --bin generator_3mf
      - shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          cp target/release/generator_3mf.exe "out/generator_3mf-${VERSION}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - run: cargo run -p xtask -- web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.html

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export CARGO_APK_RELEASE_KEYSTORE="$HOME/.android/debug.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          cargo apk build -p generator_3mf --release --lib
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          cp target/release/apk/generator_3mf.apk "out/generator_3mf-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    needs: [test, windows, web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: generator_3mf ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          files: artifacts/*
